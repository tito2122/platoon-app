name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'go.html'
      - 'register.html'
      - 'manifest.json'
      - 'version.json'
      - 'sw.js'
      - '*.png'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read version.json
        id: ver
        run: |
          VERSION=$(node -p "require('./version.json').version")
          CODE=$(node -p "require('./version.json').versionCode")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor Android
        run: npm run sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName=${{ steps.ver.outputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: platoon-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk platoon-app.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" platoon-app.apk --clobber
          else
            gh release create "$TAG" platoon-app.apk --title "גרסה ${{ steps.ver.outputs.version }}" --notes "עדכון אוטומטי מ-GitHub Actions" --latest
          fi
